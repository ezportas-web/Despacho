<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Despacho</title>
<style>
/* ===========================================================================
   DESPACHO — v19, o visual novo
   ===========================================================================
   Preto, marrom e dourado, puxando o logo da Domo. Quatro abas embaixo e
   deslizar de lado entre elas. Na aba de cotação, um pedido por tela: cotou,
   mandou, arrasta para o próximo.

   O ENVIO
     Tocar em enviar cobre a tela com uma camada: a roda dourada vai fechando
     enquanto o motor grava na planilha e manda o e-mail. Deu certo, vira um
     certo verde, a carta some e o próximo pedido fica em evidência.

     Deu erro, o app NÃO desiste: vai conferir se o romaneio saiu assim
     mesmo — porque erro de rede costuma acontecer DEPOIS de o e-mail ter
     ido. Só quando a conferência diz que não saiu é que aparece o vermelho,
     e aí a camada fica esperando você ler.
   =========================================================================== */

:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);

  --fundo: #0A0908;
  --fundo-2: #131110;
  --carta: #1E1814;
  --carta-alta: #2A211A;
  --linha: #332A23;

  --dourado: #C9A46A;
  --dourado-forte: #E0C18E;
  --texto: #EDE4D8;
  --texto-2: #A2968A;
  --texto-3: #6E645A;

  --verde: #7FA86B;
  --vermelho: #C4705E;
  --laranja: #D3924F;
  --whats: #25D366;
}

* { box-sizing: inherit; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }

body {
  background: var(--fundo);
  color: var(--texto);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px; line-height: 1.45;
  overflow: hidden;
}

button { font-family: inherit; cursor: pointer; }

/* --- o alto --- */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  padding-top: env(safe-area-inset-top, 0px);
  height: calc(62px + env(safe-area-inset-top, 0px));
  background: linear-gradient(180deg, #0A0908 0%, rgba(10,9,8,.92) 100%);
  border-bottom: 1px solid var(--linha);
  display: flex; align-items: center; justify-content: space-between;
  padding-left: 18px; padding-right: 14px;
}
header .titulo { font-size: 19px; font-weight: 600; letter-spacing: .06em; color: var(--dourado-forte); }
header .dir { display: flex; align-items: center; gap: 10px; }
header .conta { font-size: 13px; color: var(--texto-3); }
header .atualizar {
  background: none; border: 1px solid var(--linha); color: var(--texto-2);
  border-radius: 99px; padding: 6px 12px; font-size: 12px; letter-spacing: .04em;
}

/* --- as telas --- */
.telas {
  position: fixed; inset: 0;
  padding-top: calc(62px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px));
  display: flex;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; scrollbar-width: none;
}
.telas::-webkit-scrollbar { display: none; }
.tela { flex: 0 0 100%; scroll-snap-align: start; overflow-y: auto; padding: 16px 16px 30px; }
.tela.sem-padding { padding: 0; }

/* um pedido por tela, dentro da aba de cotação */
.trilho {
  display: flex; height: 100%;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; scrollbar-width: none;
}
.trilho::-webkit-scrollbar { display: none; }
.pagina { flex: 0 0 100%; scroll-snap-align: start; overflow-y: auto; padding: 16px 16px 40px; }

/* --- as abas de baixo --- */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: rgba(10,9,8,.97);
  border-top: 1px solid var(--linha);
  display: grid; grid-template-columns: repeat(4, 1fr);
}
nav button {
  background: none; border: 0; padding: 10px 0 11px;
  color: var(--texto-3); font-size: 11px; letter-spacing: .04em;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
nav button svg { width: 22px; height: 22px; stroke-width: 1.6; }
nav button.on { color: var(--dourado); }

/* --- as peças --- */
.secao {
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--texto-3); margin: 22px 2px 10px;
}
.carta {
  background: var(--carta); border: 1px solid var(--linha);
  border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
  transition: opacity .4s, transform .4s;
}
.carta.toque { width: 100%; text-align: left; color: inherit; display: block; }

.pedido { display: flex; gap: 13px; align-items: flex-start; }
.pedido .selo {
  width: 42px; height: 42px; border-radius: 12px; flex: 0 0 42px;
  background: linear-gradient(145deg, #3A2E22, #2A231C);
  border: 1px solid var(--dourado); color: var(--dourado-forte);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 600;
}
.pedido .meio { min-width: 0; flex: 1; }
.pedido .nome { font-size: 15px; font-weight: 500; }
.pedido .sub { font-size: 13px; color: var(--texto-2); margin-top: 2px; }
.pedido .oque { font-size: 12px; color: var(--texto-3); margin-top: 3px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pedido .dir { margin-left: auto; text-align: right; flex: 0 0 auto; }
.pedido .valor { font-size: 15px; color: var(--dourado-forte); font-weight: 500; }
.pedido .tempo { font-size: 12px; color: var(--texto-3); }
.pedido .tempo.tarde { color: var(--laranja); }

.etiqueta {
  display: inline-block; font-size: 11px; letter-spacing: .06em;
  padding: 3px 9px; border-radius: 99px; margin: 7px 6px 0 0;
  border: 1px solid var(--linha); color: var(--texto-2);
}
.etiqueta.junto { border-color: #6B5327; color: var(--dourado); }
.etiqueta.loja { border-color: transparent; color: #14100D; font-weight: 600; }

.item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0;
        border-top: 1px solid var(--linha); font-size: 14px; }
.item:first-of-type { border-top: 0; padding-top: 4px; }
.item .qtd { color: var(--dourado); font-weight: 600; flex: 0 0 28px; }
.item .sku { font-size: 12px; color: var(--texto-3); margin-top: 2px; }
.item .preco { margin-left: auto; color: var(--texto-2); white-space: nowrap; }

.carga { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px;
         padding-top: 12px; border-top: 1px solid var(--linha); }
.carga > div { font-size: 17px; }
.rotulo { font-size: 11px; color: var(--texto-3); letter-spacing: .08em;
          text-transform: uppercase; display: block; }

/* as transportadoras */
.transp {
  display: flex; align-items: center; gap: 12px;
  background: var(--carta); border: 1px solid var(--linha);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
  width: 100%; text-align: left; color: inherit;
}
.transp.melhor { border-color: var(--dourado); background: var(--carta-alta); }
.transp.escolhida { border-color: var(--dourado-forte); box-shadow: 0 0 0 2px rgba(224,193,142,.18); }
.transp.recusada { opacity: .5; }
.transp .marca {
  width: 36px; height: 36px; border-radius: 10px; flex: 0 0 36px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 15px; color: #14100D;
}
.transp .meio { flex: 1; min-width: 0; }
.transp .nome { font-size: 14px; font-weight: 500; letter-spacing: .03em; }
.transp .obs { font-size: 12px; color: var(--texto-2); }
.transp .obs.alerta { color: var(--laranja); }
.transp .preco { margin-left: auto; text-align: right; flex: 0 0 auto; }
.transp .preco b { font-size: 16px; font-weight: 600; color: var(--dourado-forte); }
.transp .preco b.caro { color: var(--laranja); }
.transp .preco span { display: block; font-size: 12px; color: var(--texto-3); }

input, textarea {
  background: var(--fundo-2); border: 1px solid var(--linha);
  border-radius: 10px; color: var(--texto);
  padding: 11px 12px; font-size: 15px; font-family: inherit; width: 100%;
}
input::placeholder { color: var(--texto-3); }
textarea { min-height: 260px; font-size: 13px; line-height: 1.5;
           font-family: ui-monospace, Menlo, Consolas, monospace; resize: vertical; }

.botao {
  width: 100%; padding: 14px; border-radius: 12px; border: 0;
  background: linear-gradient(145deg, #D4B279, #B8935A);
  color: #14100D; font-size: 15px; font-weight: 600; letter-spacing: .04em;
  margin-top: 10px;
}
.botao:disabled { opacity: .5; }
.botao.whats { background: var(--whats); color: #fff; }
.botao.vazio { background: none; border: 1px solid var(--linha); color: var(--texto-2); font-weight: 500; }
.botao.pequeno { width: auto; padding: 7px 14px; font-size: 13px; margin: 0; }

.nota { font-size: 12px; color: var(--texto-3); margin-top: 8px; }
.nota.alerta { color: var(--laranja); }
.aviso {
  background: var(--carta-alta); border: 1px solid #6B5327; border-radius: 12px;
  padding: 12px 14px; font-size: 13px; color: var(--dourado-forte); margin-bottom: 12px;
}
.carregando, .vazio { text-align: center; color: var(--texto-3); padding: 40px 20px; font-size: 14px; }

/* faturamento */
.numero { font-size: 30px; font-weight: 600; color: var(--dourado-forte); }
.colunas { display: flex; align-items: flex-end; gap: 3px; height: 120px; margin-top: 14px; }
.colunas div { flex: 1; border-radius: 3px 3px 0 0;
               background: linear-gradient(180deg, var(--dourado), #6B5327); opacity: .75; }
.colunas div.hoje { opacity: 1; background: var(--dourado-forte); }
.colunas div.fraco { opacity: .35; }
.faixa { display: flex; justify-content: space-between; align-items: baseline; }
.faixa .num { font-size: 18px; display: block; }
.faixa .centro .num { font-size: 22px; color: var(--dourado-forte); }
.linha-mes { display: flex; justify-content: space-between; padding: 8px 0;
             border-top: 1px solid var(--linha); font-size: 14px; }
.linha-mes:first-of-type { border-top: 0; }
.pos { color: var(--verde); } .neg { color: var(--vermelho); }

/* --- a camada do envio --- */
.camada {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(10,9,8,.84);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
}
.camada.on { display: flex; }
.camada .caixa { text-align: center; padding: 30px; max-width: 340px; }
.roda { position: relative; width: 116px; height: 116px; margin: 0 auto; }
.roda svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.roda circle { fill: none; stroke-width: 5; }
.roda .trilhoc { stroke: #2A221B; }
.roda .corda { stroke: var(--dourado); stroke-linecap: round;
               stroke-dasharray: 264; stroke-dashoffset: 264;
               transition: stroke-dashoffset .35s ease; }
.roda .pct { position: absolute; inset: 0; display: flex; align-items: center;
             justify-content: center; font-size: 24px; font-weight: 600; color: var(--dourado-forte); }
.certo, .erro { width: 116px; height: 116px; display: none; }
.certo circle, .erro circle { fill: none; stroke-width: 4; }
.certo path, .erro path { fill: none; stroke-width: 7; stroke-linecap: round; }
.certo circle, .certo path { stroke: var(--verde); }
.erro circle, .erro path { stroke: var(--vermelho); }
.certo.on, .erro.on { display: block; margin: 0 auto; animation: nascer .3s ease; }
@keyframes nascer { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.camada .recado { margin-top: 22px; font-size: 17px; letter-spacing: .03em; }
.camada .detalhe { margin-top: 8px; font-size: 13px; color: var(--texto-2); white-space: pre-wrap; }

.foi { animation: subirSumir .55s ease forwards; }
@keyframes subirSumir { to { transform: translateY(-46px); opacity: 0; } }
.agora { animation: acender 1.2s ease; }
@keyframes acender {
  0%   { border-color: var(--dourado); box-shadow: 0 0 0 3px rgba(201,164,106,.16); }
  100% { border-color: var(--linha); box-shadow: none; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<!-- A CAMADA DO ENVIO -->
<div class="camada" id="camada">
  <div class="caixa">
    <div class="roda" id="roda">
      <svg viewBox="0 0 100 100">
        <circle class="trilhoc" cx="50" cy="50" r="42"/>
        <circle class="corda" id="corda" cx="50" cy="50" r="42"/>
      </svg>
      <div class="pct" id="pct">0%</div>
    </div>
    <svg class="certo" id="certo" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42"/><path d="M30 51 L44 65 L70 37"/>
    </svg>
    <svg class="erro" id="erro" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42"/><path d="M50 28 L50 56"/><path d="M50 68 L50 70"/>
    </svg>
    <div class="recado" id="recado">enviando o romaneio…</div>
    <div class="detalhe" id="detalhe-camada"></div>
    <button class="botao vazio" id="fechar" onclick="fecharCamada()" style="display:none">ENTENDI</button>
  </div>
</div>

<header>
  <div class="titulo" id="titulo">DESPACHO</div>
  <div class="dir">
    <span class="conta" id="conta"></span>
    <button class="atualizar" onclick="recarregar()">atualizar</button>
  </div>
</header>

<div class="telas" id="telas">

  <!-- ================= 0 · PEDIDOS ================= -->
  <section class="tela" id="tela-pedidos">
    <div class="aviso" id="aviso" style="display:none"></div>
    <div id="lista"><div class="carregando">Carregando…</div></div>
  </section>

  <!-- ================= 1 · COTAÇÃO ================= -->
  <section class="tela sem-padding">
    <div class="trilho" id="trilho">
      <div class="pagina"><div class="vazio">Toque num pedido para cotar.</div></div>
    </div>
  </section>

  <!-- ================= 2 · FATURAMENTO ================= -->
  <section class="tela">
    <div id="fat"><div class="carregando">Carregando…</div></div>
  </section>

  <!-- ================= 3 · AJUSTES ================= -->
  <section class="tela">
    <div class="secao" style="margin-top:4px">Conexão</div>
    <div class="carta">
      <span class="rotulo">endereço do motor (termina em /exec)</span>
      <input id="cfg-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" style="margin-top:6px">
      <span class="rotulo" style="margin-top:14px">chave</span>
      <input id="cfg-chave" type="text" placeholder="a mesma que está no CHAVE_APP" style="margin-top:6px">
      <button class="botao" onclick="salvarConfig()">SALVAR</button>
      <div class="nota" id="cfg-status"></div>
    </div>

    <div class="secao">Ferramentas</div>
    <div class="carta">
      <button class="botao vazio" style="margin-top:0" onclick="testarRotaRodonaves()">TESTAR A ROTA DA RODONAVES</button>
      <div class="nota" id="teste-rota" style="white-space:pre-wrap"></div>
      <button class="botao vazio" onclick="forcarAtualizacao()">BUSCAR VERSÃO NOVA</button>
      <div class="nota" style="text-align:center;margin-top:14px;opacity:.7">
        versão <span id="cfg-versao">v20</span></div>
    </div>
  </section>

</div>

<nav>
  <button id="aba-0" class="on" onclick="irPara(0)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7h18M3 12h18M3 17h12"/></svg>
    PEDIDOS</button>
  <button id="aba-1" onclick="irPara(1)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>
    COTAÇÃO</button>
  <button id="aba-2" onclick="irPara(2)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
    FATURAR</button>
  <button id="aba-3" onclick="irPara(3)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    AJUSTES</button>
</nav>

<script>
// ===========================================================================
// O ESSENCIAL
// ===========================================================================
// O aplicativo não sabe nada sozinho: pergunta tudo ao motor no Apps Script.
// O endereço e a chave ficam guardados no aparelho.
var cfg = {
  url: localStorage.getItem('app_url') || '',
  chave: localStorage.getItem('app_chave') || ''
};

var PEDIDOS = [];
var FAT = null;

/**
 * O ESTADO É POR PEDIDO, não global
 *   Na tela antiga havia um pedido aberto por vez, e as variáveis eram
 *   soltas. Agora cada pedido tem a sua tela no trilho, e você pode ter
 *   cotado três antes de enviar o primeiro. Então tudo mora num mapa pelo
 *   número da venda.
 */
var cotacoesProntas = {};   // id -> cotação
var escolhas = {};          // id -> transportadora escolhida
var cotando = {};           // id -> true enquanto o SSW responde
var rodonaves = {};         // id -> true enquanto a Rodonaves responde
var atual = 0;              // a tela do trilho que está na frente
var esperandoVoce = false;  // a fila de fundo sai da frente

var CORES = { SINIL:'#6F8FAE', AZURELOG:'#8B7AB5', ITOUPAVA:'#6FA58A',
  TRANSOLIVEIRA:'#C88A5A', ARLETE:'#B5646E', TW:'#5FA6A0', RODONAVES:'#C9A46A' };

function $(id){ return document.getElementById(id); }
function cor(t){ return CORES[t] || '#8E7A5E'; }
function brl(n){ return 'R$ ' + Number(n||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function curto(n){
  n = Number(n||0);
  if (n >= 1000000) return 'R$ ' + (n/1000000).toFixed(2).replace('.',',') + ' mi';
  if (n >= 1000) return 'R$ ' + Math.round(n/1000) + ' mil';
  return brl(n);
}
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cpfFmt(c){
  c = String(c||'').replace(/\D/g,'');
  if (c.length===11) return c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  if (c.length===14) return c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  return c;
}
function cepFmt(c){ c = String(c||'').replace(/\D/g,''); return c.length===8 ? c.replace(/(\d{5})(\d{3})/,'$1-$2') : c; }
function iniciais(nome){
  var p = String(nome||'').trim().split(/\s+/);
  return ((p[0]||'').charAt(0) + (p[p.length-1]||'').charAt(0)).toUpperCase() || '·';
}
function idDe(p){ return p && p.ids ? p.ids[0] : ''; }

// ---------------------------------------------------------------------------
// A conversa com o motor
// ---------------------------------------------------------------------------
async function pedir(api, extras) {
  if (!cfg.url || !cfg.chave) throw new Error('Falta configurar o endereço e a chave.');
  var u = cfg.url + '?api=' + encodeURIComponent(api) + '&chave=' + encodeURIComponent(cfg.chave);
  for (var k in (extras||{})) {
    if (extras[k] !== undefined && extras[k] !== null) u += '&' + k + '=' + encodeURIComponent(extras[k]);
  }
  var r = await fetch(u, { redirect: 'follow' });
  if (!r.ok) throw new Error('o motor respondeu ' + r.status);
  var d = await r.json();
  if (d.erro) throw new Error(d.erro);
  return d;
}

// ===========================================================================
// NAVEGAÇÃO — as abas e o deslizar conversam
// ===========================================================================
var telas = $('telas');
var TITULOS = ['DESPACHO', 'COTAÇÃO', 'FATURAMENTO', 'AJUSTES'];

function irPara(i) {
  telas.scrollTo({ left: telas.clientWidth * i, behavior: 'smooth' });
  marcarAba(i);
}
function marcarAba(i) {
  for (var n = 0; n < 4; n++) $('aba-' + n).classList.toggle('on', n === i);
  $('titulo').textContent = TITULOS[i];
  atualizarConta(i);
  if (i === 2 && !FAT) carregarFaturamento();
  if (i === 0 && !PEDIDOS.length) carregarPedidos();
}
function atualizarConta(i) {
  if (i === 0) $('conta').textContent = PEDIDOS.length ? PEDIDOS.length + (PEDIDOS.length===1?' pedido':' pedidos') : '';
  else if (i === 1) $('conta').textContent = PEDIDOS.length ? (atual + 1) + ' de ' + PEDIDOS.length : '';
  else $('conta').textContent = '';
}

var esperaAba;
telas.addEventListener('scroll', function () {
  clearTimeout(esperaAba);
  esperaAba = setTimeout(function () { marcarAba(Math.round(telas.scrollLeft / telas.clientWidth)); }, 60);
});

function abaAtual() { return Math.round(telas.scrollLeft / telas.clientWidth); }

function recarregar() {
  var i = abaAtual();
  if (i === 2) { FAT = null; carregarFaturamento(); }
  else { carregarPedidos(true); }
}

// ===========================================================================
// PEDIDOS — a lista
// ===========================================================================
async function carregarPedidos(forcar) {
  $('lista').innerHTML = '<div class="carregando">Buscando pedidos…</div>';
  try {
    var d = await pedir('pedidos', { forcar: forcar ? 1 : 0 });
    PEDIDOS = d.pedidos || [];
    if (forcar) cotacoesProntas = {};   // cotação tem validade
    if (atual >= PEDIDOS.length) atual = Math.max(0, PEDIDOS.length - 1);
    montarLista();
    montarTrilho();
    atualizarConta(abaAtual());
    prepararCotacoes();
  } catch (e) {
    $('lista').innerHTML = '<div class="vazio">' + esc(e.message) + '</div>';
  }
}

function montarLista() {
  if (!PEDIDOS.length) {
    $('lista').innerHTML = '<div class="vazio">Nenhum pedido esperando despacho.</div>';
    return;
  }
  $('lista').innerHTML = PEDIDOS.map(function(p, i){
    var resumo = p.itens.map(function(x){ return x.qtd+'× '+x.nome; }).join(' + ');
    var tempo = p.dias >= 2 ? 'há ' + p.dias + ' dias' : (p.dias === 1 ? 'ontem' : 'hoje');
    return '<button class="carta toque" id="carta-' + esc(idDe(p)) + '" onclick="abrirPedido('+i+')">'+
      '<div class="pedido">'+
        '<div class="selo">'+esc(iniciais(p.cliente))+'</div>'+
        '<div class="meio">'+
          '<div class="nome">'+esc(p.cliente)+'</div>'+
          '<div class="sub">'+esc(p.cidade||'')+(p.uf?' / '+esc(p.uf):'')+' · '+p.peso+' kg · '+p.volumes+(p.volumes>1?' volumes':' volume')+'</div>'+
          '<div class="oque">'+esc(resumo)+'</div>'+
          '<span class="etiqueta loja" style="background:'+(p.lojaCor||'#C9A46A')+'">'+esc(p.lojaCurto||'')+'</span>'+
          (p.juntos>1 ? '<span class="etiqueta junto">'+p.juntos+' compras juntas</span>' : '')+
          (cotacoesProntas[idDe(p)] ? '<span class="etiqueta">cotado</span>' : '')+
        '</div>'+
        '<div class="dir"><div class="valor">'+brl(p.total)+'</div>'+
          '<div class="tempo'+(p.dias>=2?' tarde':'')+'">'+tempo+'</div></div>'+
      '</div></button>';
  }).join('');
}

/** Toca num pedido: vai para a aba de cotação, na tela dele. */
function abrirPedido(i) {
  atual = i;
  irPara(1);
  var trilho = $('trilho');
  setTimeout(function(){ trilho.scrollTo({ left: trilho.clientWidth * i, behavior: 'auto' }); }, 80);
  garantirCotacao(i);
}

// ===========================================================================
// A FILA DE FUNDO — cota três de antemão, uma por vez
// ===========================================================================
var preparando = false;
async function prepararCotacoes() {
  if (preparando) return;
  preparando = true;
  await new Promise(function (r) { setTimeout(r, 4000); });
  var feitos = 0;
  for (var i = 0; i < PEDIDOS.length && feitos < 3; i++) {
    while (esperandoVoce) await new Promise(function (r) { setTimeout(r, 500); });
    var p = PEDIDOS[i];
    if (!p || cotacoesProntas[idDe(p)]) continue;
    try {
      var d = await pedir('cotar', { loja: p.loja, pedido: idDe(p) });
      cotacoesProntas[idDe(p)] = d;
      feitos++;
      desenharPagina(i);
      montarLista();
    } catch (e) {}
  }
  preparando = false;
}

// ===========================================================================
// COTAÇÃO — um pedido por tela
// ===========================================================================
function montarTrilho() {
  var trilho = $('trilho');
  if (!PEDIDOS.length) {
    trilho.innerHTML = '<div class="pagina"><div class="vazio">Nenhum pedido esperando despacho.</div></div>';
    return;
  }
  trilho.innerHTML = PEDIDOS.map(function(p, i){
    return '<div class="pagina" id="pagina-' + esc(idDe(p)) + '" data-i="' + i + '"></div>';
  }).join('');
  PEDIDOS.forEach(function(p, i){ desenharPagina(i); });
}

/** O trilho parou numa tela: ela vira a atual e cota se ainda não cotou. */
var esperaTrilho;
$('trilho').addEventListener('scroll', function () {
  clearTimeout(esperaTrilho);
  esperaTrilho = setTimeout(function () {
    var t = $('trilho');
    var i = Math.round(t.scrollLeft / t.clientWidth);
    if (i !== atual) { atual = i; atualizarConta(1); garantirCotacao(i); }
  }, 80);
});

function garantirCotacao(i) {
  var p = PEDIDOS[i];
  if (!p) return;
  if (!cotacoesProntas[idDe(p)] && !cotando[idDe(p)]) cotar(i);
}

async function cotar(i) {
  var p = PEDIDOS[i];
  if (!p) return;
  var id = idDe(p);
  cotando[id] = true;
  esperandoVoce = true;
  desenharPagina(i);

  try {
    var d = await pedir('cotar', { loja: p.loja, pedido: id });
    cotacoesProntas[id] = d;
  } catch (e) {
    cotacoesProntas[id] = { cotadas:[], manuais:[], recusadas:[], avisos:['Falhou: '+e.message] };
  } finally {
    cotando[id] = false;
    esperandoVoce = false;
  }
  desenharPagina(i);
  montarLista();

  // a Rodonaves entra sozinha, logo depois — ela é lenta e ficaria
  // segurando as outras se cotasse junto
  var c = cotacoesProntas[id];
  if (c && (c.sobDemanda || []).length && !rodonaves[id]) cotarRodonaves(i);
}

async function cotarRodonaves(i) {
  var p = PEDIDOS[i];
  if (!p) return;
  var id = idDe(p);
  var c = cotacoesProntas[id];
  if (!c) return;

  c.sobDemanda = [];
  rodonaves[id] = true;
  desenharPagina(i);
  esperandoVoce = true;

  try {
    var d = await pedir('rodonaves', { loja: p.loja, pedido: id });
    function semRodonaves(lista) { return (lista||[]).filter(function(x){ return x.t !== 'RODONAVES'; }); }
    c.cotadas = semRodonaves(c.cotadas).concat(d.cotadas||[]);
    c.manuais = semRodonaves(c.manuais).concat(d.manuais||[]);
    c.recusadas = semRodonaves(c.recusadas).concat(d.recusadas||[]);
    c.cotadas.sort(function(a,b){ return a.v - b.v; });
  } catch (e) {
    c.avisos = (c.avisos||[]).concat(['Rodonaves falhou: '+e.message]);
  } finally {
    esperandoVoce = false;
    rodonaves[id] = false;
  }
  desenharPagina(i);
}

function desenharPagina(i) {
  var p = PEDIDOS[i];
  if (!p) return;
  var id = idDe(p);
  var pagina = $('pagina-' + id);
  if (!pagina) return;

  var c = cotacoesProntas[id];
  var d = (c && c.destino) || { endereco: p.endereco, cidade: p.cidade, uf: p.uf,
                                  cep: p.cepDestino, recebe: p.recebe, cpf: p.cpf };
  var doc = (d && d.cpf) || p.cpf || '';

  var h = '';

  // ---- o cabeçalho do pedido ----
  h += '<div class="carta" style="border-color:#4A3D2E">'+
    '<div class="pedido"><div class="selo">'+esc(iniciais(p.cliente))+'</div>'+
    '<div class="meio"><div class="nome">'+esc(p.cliente)+'</div>'+
    '<div class="sub">'+esc(d.endereco||'')+(d.endereco?'<br>':'')+esc(d.cidade||'')+' / '+esc(d.uf||'')+
    (d.cep ? ' · '+cepFmt(d.cep) : '')+
    (d.recebe && d.recebe!==p.cliente ? '<br>recebe: '+esc(d.recebe) : '')+'</div>'+
    '<div class="oque" style="white-space:normal">venda '+esc(p.ids.join(' / '))+' · '+
    (doc ? 'CPF '+cpfFmt(doc) : '<span style="color:var(--laranja)">sem CPF</span>')+'</div>'+
    '<span class="etiqueta loja" style="background:'+(p.lojaCor||'#C9A46A')+'">'+esc(p.lojaNome||p.lojaCurto||'')+'</span>'+
    (p.juntos>1 ? '<span class="etiqueta junto">'+p.juntos+' compras juntas</span>' : '')+
    '</div></div>';

  h += '<div style="margin-top:12px">' + p.itens.map(function(x){
    return '<div class="item"><div class="qtd">'+x.qtd+'×</div><div style="flex:1">'+esc(x.nome)+
      '<div class="sku">SKU '+esc(x.sku||'?')+'</div></div><div class="preco">'+brl(x.valor)+'</div></div>';
  }).join('') + '</div>';

  h += '<div class="carga">'+
    '<div><span class="rotulo">peso</span>'+p.peso+' kg</div>'+
    '<div><span class="rotulo">cubagem</span>'+Number(p.cubagem||0).toFixed(4).replace('.',',')+' m³</div>'+
    '<div><span class="rotulo">volumes</span>'+p.volumes+'</div>'+
    '<div><span class="rotulo">nota</span>'+brl(p.total)+'</div></div>';
  h += '</div>';

  // ---- as cotações ----
  if (!c) {
    h += cotando[id]
      ? '<div class="carregando">Consultando as transportadoras…</div>'
      : '<button class="botao" onclick="cotar('+i+')">COTAR FRETE</button>';
  } else {
    h += montarCotacoes(i, c, d);
    if (escolhas[id]) h += montarEnvio(i, p, c);
  }

  h += '<div class="nota" style="text-align:center;margin-top:22px">arraste para o lado ↔ próximo pedido</div>';
  pagina.innerHTML = h;
}

function montarCotacoes(i, c, d) {
  var p = PEDIDOS[i], id = idDe(p);
  var esc_ = escolhas[id];
  var h = '';

  if (rodonaves[id]) h += '<div class="nota alerta" style="margin-top:14px">Cotação em andamento — a Rodonaves leva até um minuto.</div>';

  if (c.cotadas.length || (c.sobDemanda||[]).length || rodonaves[id]) {
    h += '<div class="secao">Quem atende '+esc(d.cidade||'')+'</div>';
    h += c.cotadas.map(function(x, n){
      var melhor = (n===0), escolhida = esc_ && esc_.t===x.t;
      return '<button class="transp'+(melhor?' melhor':'')+(escolhida?' escolhida':'')+'" onclick="escolher('+i+',\''+esc(x.t)+'\')">'+
        '<div class="marca" style="background:'+cor(x.t)+'">'+x.t.charAt(0)+'</div>'+
        '<div class="meio"><div class="nome">'+esc(x.t)+'</div>'+
        (x.obs ? '<div class="obs alerta">'+esc(x.obs)+'</div>' : (melhor?'<div class="obs">mais barata</div>':''))+'</div>'+
        '<div class="preco"><b'+(x.caro?' class="caro"':'')+'>'+brl(x.v)+'</b>'+
        '<span>'+(x.prazo?x.prazo+' dias':'')+(x.cotacao?' · '+esc(x.cotacao):'')+'</span></div></button>';
    }).join('');
  }

  if (rodonaves[id]) {
    h += '<div class="transp"><div class="marca" style="background:'+cor('RODONAVES')+'">R</div>'+
      '<div class="meio"><div class="nome">RODONAVES</div><div class="obs">cotando… ela demora mesmo</div></div>'+
      '<div class="preco"><span>aguarde</span></div></div>';
  } else {
    (c.sobDemanda||[]).forEach(function(s){
      h += '<button class="transp" onclick="cotarRodonaves('+i+')"><div class="marca" style="background:'+cor(s.t)+'">'+s.t.charAt(0)+'</div>'+
        '<div class="meio"><div class="nome">'+esc(s.t)+'</div><div class="obs">na fila, ela é a última</div></div>'+
        '<div class="preco"><span>aguarde</span></div></button>';
    });
  }

  (c.avisos||[]).forEach(function(a){ h += '<div class="nota alerta">'+esc(a)+'</div>'; });

  if (c.manuais && c.manuais.length) {
    h += '<div class="secao">Cotar por fora</div>';
    h += c.manuais.map(function(m){
      return '<div class="transp"><div class="marca" style="background:'+cor(m.t)+'">'+m.t.charAt(0)+'</div>'+
        '<div class="meio"><div class="nome">'+esc(m.t)+'</div><div class="obs">'+esc(m.obs||'sem cotação automática')+'</div></div>'+
        '<div class="preco"><input type="text" inputmode="decimal" placeholder="R$ 0,00" style="width:110px;text-align:right;padding:8px" '+
        'onchange="escolherManual('+i+',\''+esc(m.t)+'\',this.value)"></div></div>';
    }).join('');
  }

  h += blocoWhatsApp_(i, d);

  if (c.recusadas && c.recusadas.length) {
    h += '<div class="secao">Não atendem</div>';
    h += c.recusadas.map(function(r){
      return '<div class="transp recusada"><div class="marca" style="background:#3A312A;color:var(--texto-2)">'+r.t.charAt(0)+'</div>'+
        '<div class="meio"><div class="nome">'+esc(r.t)+'</div><div class="obs">'+esc(r.msg||'')+'</div></div></div>';
    }).join('');
  }
  return h;
}

function escolher(i, t) {
  var p = PEDIDOS[i], id = idDe(p), c = cotacoesProntas[id];
  escolhas[id] = c.cotadas.filter(function(x){ return x.t===t; })[0];
  desenharPagina(i);
  setTimeout(function(){ var e = $('escopo-'+id); if (e) e.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
}

function escolherManual(i, t, valor) {
  var v = parseFloat(String(valor).replace(/\./g,'').replace(',','.'));
  if (!v || v<=0) return;
  escolhas[idDe(PEDIDOS[i])] = { t:t, v:v, prazo:null };
  desenharPagina(i);
}

    obs: function () { return 'cotação por mensagem'; },
    parceira: function () { return ''; }
  }
];

function blocoWhatsApp_(i, d) {
  var uf = String((d && d.uf) || '').toUpperCase();
  if (!uf) return '';
  var servem = WHATS.filter(function (w) { return w.estados.indexOf(uf) >= 0; });
  if (!servem.length) return '';
  var id = idDe(PEDIDOS[i]);

  var h = '<div class="secao">Cotar pelo WhatsApp</div>';
  servem.forEach(function (w) {
    var parceira = w.parceira(uf);
    var nomeFatura = parceira ? w.nome + ' / ' + parceira : w.nome;
    h += '<div class="carta">'+
      '<div style="display:flex;align-items:center;gap:12px">'+
        '<div class="marca" style="background:var(--whats);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">W</div>'+
        '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">'+esc(nomeFatura)+'</div>'+
        '<div class="nota" style="margin:0">'+esc(w.quem + ' — ' + w.obs(uf))+'</div></div>'+
        '<button class="botao whats pequeno" onclick="mandarWhats('+i+',\''+w.nome+'\')">abrir ↗</button>'+
      '</div>'+
      '<div style="display:flex;gap:8px;margin-top:12px">'+
        '<input id="wa-cot-'+w.nome+'-'+esc(id)+'" type="text" placeholder="nº da cotação" style="flex:1;min-width:0">'+
        '<input id="wa-val-'+w.nome+'-'+esc(id)+'" type="text" inputmode="decimal" placeholder="R$ 0,00" style="width:120px;text-align:right">'+
      '</div>'+
      '<button class="botao vazio" onclick="usarWhats('+i+',\''+w.nome+'\')">USAR ESTA COTAÇÃO</button>'+
    '</div>';
  });
  return h;
}

function textoCotacaoWhats_(i) {
  var p = PEDIDOS[i];
  var c = cotacoesProntas[idDe(p)];
  var d = (c && c.destino) || { cidade: p.cidade, uf: p.uf, cep: p.cepDestino, cpf: p.cpf };
  var doc = String(d.cpf || p.cpf || '').replace(/\D/g, '');
  var docTexto = doc.length === 14 ? 'CNPJ ' + cpfFmt(doc) : 'CPF ' + cpfFmt(doc);
  var m = p.medidas;
  var medidas = m ? m.l.toFixed(2).replace('.', ',') + ' x ' + m.a.toFixed(2).replace('.', ',') + ' x ' + m.e.toFixed(2).replace('.', ',') + ' m' : '(conferir)';
  return [
    'CLIENTE: ' + (d.nomeNota || p.clienteNota || p.cliente || ''),
    'CNPJ DO REMETENTE: 59.315.378/0001-27',
    'CIDADE REMETENTE: Rodeio / SC - CEP 89136-000',
    'CNPJ DO DESTINATÁRIO: ' + docTexto,
    'INSCRIÇÃO ESTADUAL DESTINO: ISENTO',
    'CIDADE E ESTADO DESTINO: ' + (d.cidade || '') + ' / ' + (d.uf || '') + ' - CEP ' + cepFmt(d.cep),
    'CNPJ DO TOMADOR DO FRETE: 59.315.378/0001-27',
    'VALOR DA MERCADORIA: R$ ' + Number(p.total || 0).toFixed(2).replace('.', ','),
    'QUANTIDADE DE VOLUMES: ' + (p.volumes || 1),
    'PESO: ' + Number(p.peso || 0).toFixed(2).replace('.', ',') + ' kg',
    'MEDIDAS DOS VOLUMES: ' + medidas,
    'MATERIAL A SER TRANSPORTADO: Portas de madeira com kit de ferragem'
  ].join('\n');
}

function mandarWhats(i, nome) {
  var w = WHATS.filter(function (x) { return x.nome === nome; })[0];
  if (!w) return;
  window.open('https://wa.me/' + w.numero + '?text=' + encodeURIComponent(textoCotacaoWhats_(i)), '_blank');
}

function usarWhats(i, nome) {
  var w = WHATS.filter(function (x) { return x.nome === nome; })[0];
  var p = PEDIDOS[i]; if (!w || !p) return;
  var id = idDe(p);
  var cot = ($('wa-cot-'+nome+'-'+id) || {}).value || '';
  var bruto = ($('wa-val-'+nome+'-'+id) || {}).value || '';
  var v = parseFloat(String(bruto).replace(/\./g, '').replace(',', '.'));
  if (!v || v <= 0) { alert('Escreva o valor do frete que eles passaram.'); return; }
  var c = cotacoesProntas[id];
  var uf = String(((c && c.destino) || {}).uf || p.uf || '').toUpperCase();
  var parceira = w.parceira(uf);
  escolhas[id] = { t: parceira ? w.nome + ' / ' + parceira : w.nome, v: v, prazo: null, cotacao: String(cot).trim() };
  desenharPagina(i);
  setTimeout(function(){ var e = $('escopo-'+id); if (e) e.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
}

// ===========================================================================
// O ENVIO
// ===========================================================================
function montarEnvio(i, p, c) {
  var id = idDe(p), e = escolhas[id];
  var base = c.escopoBase || '';
  var peso = Number(p.peso || 0).toFixed(2).replace('.', ',');
  // VALOR FRETE (lá em cima) é o que o comprador pagou; VALOR DO FRETE (aqui)
  // é o que a transportadora cobra — parece erro de digitação e não é
  var texto = base + '\n\nTRANSPORTADORA: ' + e.t + '\nNÚMERO DA COTAÇÃO: ' + (e.cotacao || '') +
              '\nPESO (KG): ' + peso + '\nVALOR DO FRETE: ' + brl(e.v);
  return '<div class="secao">Confira antes de enviar</div>'+
    '<textarea id="escopo-'+esc(id)+'">'+esc(texto)+'</textarea>'+
    '<button class="botao" onclick="enviar('+i+')">ENVIAR POR '+esc(e.t)+'</button>';
}

var camada = $('camada'), corda = $('corda'), pct = $('pct'), roda = $('roda');
var certo = $('certo'), erro = $('erro'), recado = $('recado'), detalheCamada = $('detalhe-camada'), fechar = $('fechar');
var andando = null;

function pintar(q) { corda.style.strokeDashoffset = 264 - (264 * q / 100); pct.textContent = Math.round(q) + '%'; }

function abrirCamada() {
  camada.classList.add('on');
  roda.style.display = 'block';
  certo.classList.remove('on'); erro.classList.remove('on');
  fechar.style.display = 'none';
  recado.textContent = 'enviando o romaneio…';
  detalheCamada.textContent = 'gravando na planilha, mandando o e-mail e avisando o comprador';
  pintar(0);
  var q = 0;
  clearInterval(andando);
  // a roda anda sozinha até 88% — o resto só fecha quando o motor responde
  andando = setInterval(function(){ q += 4 + Math.random()*5; if (q >= 88) { q = 88; clearInterval(andando); } pintar(q); }, 220);
}
function fecharCamada() { camada.classList.remove('on'); clearInterval(andando); }

async function enviar(i) {
  var p = PEDIDOS[i]; if (!p) return;
  var id = idDe(p), e = escolhas[id];
  var textoEscopo = ($('escopo-'+id) || {}).value || '';

  abrirCamada();
  var resultado = null;
  try {
    resultado = await pedir('enviar', { loja: p.loja, pedido: id, transp: e.t, frete: e.v, cotacao: e.cotacao || '', escopo: textoEscopo });
  } catch (err) {
    resultado = { email:false, planilha:false, avisos:['Falhou: ' + err.message], caiu: true };
  }

  if (resultado && (resultado.planilha || resultado.email)) { deuCerto(i, resultado); return; }
  conferir(i, resultado);
}

/**
 * A CONFERÊNCIA DEPOIS DO ERRO
 *   O motor grava, manda o e-mail e só então responde. Se a rede cai nesse
 *   meio, o app recebe erro de algo que FOI FEITO. Repetir mandaria um
 *   segundo e-mail; aceitar o erro deixaria você sem saber.
 *
 *   Então ele pede a lista de novo, forçando o motor a reler: se o pedido
 *   não está mais entre os abertos, foi despachado. Se ainda está, não foi.
 */
async function conferir(i, resultado) {
  var p = PEDIDOS[i], id = idDe(p);
  clearInterval(andando);
  roda.style.display = 'none';
  erro.classList.add('on');
  recado.textContent = 'a chamada falhou';
  detalheCamada.textContent = 'conferindo se o romaneio saiu assim mesmo…';

  var saiu = false, motivo = (resultado && resultado.avisos || []).join('\n');
  try {
    var d = await pedir('pedidos', { forcar: 1 });
    var lista = d.pedidos || [];
    saiu = !lista.some(function(x){ return idDe(x) === id; });
    if (!saiu) { PEDIDOS = lista; }
  } catch (err) {
    motivo += '\nE a conferência também falhou: ' + err.message;
  }

  if (saiu) {
    erro.classList.remove('on');
    deuCerto(i, { avisos: ['A chamada deu erro, mas o romaneio tinha saído. Nada foi enviado duas vezes.'] });
    return;
  }
  naoFoi(motivo || 'o motor não confirmou a gravação');
}

function deuCerto(i, resultado) {
  var p = PEDIDOS[i], id = idDe(p);
  clearInterval(andando); pintar(100);
  setTimeout(function(){
    roda.style.display = 'none';
    certo.classList.add('on');
    recado.textContent = 'romaneio enviado';
    var linhas = (resultado && resultado.avisos && resultado.avisos.length) ? resultado.avisos.slice() : ['o Everton já recebeu'];
    // o cronômetro do motor: se o envio voltar a demorar, é aqui que se vê onde
    if (resultado && resultado.tempos) linhas.push('\n' + resultado.tempos);
    detalheCamada.textContent = linhas.join('\n');
  }, 300);

  setTimeout(function(){
    fecharCamada();
    // a carta sobe e some, o pedido sai da lista, o próximo fica em evidência
    var carta = $('carta-'+id); if (carta) carta.classList.add('foi');
    var pagina = $('pagina-'+id); if (pagina) pagina.classList.add('foi');

    setTimeout(function(){
      PEDIDOS = PEDIDOS.filter(function(x){ return idDe(x) !== id; });
      delete cotacoesProntas[id]; delete escolhas[id];
      if (atual >= PEDIDOS.length) atual = Math.max(0, PEDIDOS.length - 1);
      montarLista(); montarTrilho(); atualizarConta(abaAtual());
      var t = $('trilho');
      t.scrollTo({ left: t.clientWidth * atual, behavior: 'auto' });
      var prox = PEDIDOS[atual];
      if (prox) {
        var cp = $('carta-'+idDe(prox)); if (cp) cp.classList.add('agora');
        garantirCotacao(atual);
      }
    }, 560);
  }, 1700);
}

function naoFoi(motivo) {
  roda.style.display = 'none';
  erro.classList.add('on');
  recado.textContent = 'o romaneio NÃO foi enviado';
  detalheCamada.textContent = motivo;
  fechar.style.display = 'block';
}

// ===========================================================================
// FATURAMENTO
// ===========================================================================
async function carregarFaturamento() {
  $('fat').innerHTML = '<div class="carregando">Carregando…</div>';
  try { FAT = await pedir('faturamento', {}); montarFaturamento(); }
  catch (e) { $('fat').innerHTML = '<div class="vazio">'+esc(e.message)+'</div>'; }
}

function montarFaturamento() {
  var f = FAT;
  var maior = Math.max.apply(null, f.serie.map(function(x){ return x.valor; })) || 1;
  var hoje = new Date().getDate();
  var colunas = f.serie.map(function(x){
    var alt = Math.round((x.valor / maior) * 100);
    var classe = x.dia===hoje ? 'hoje' : (x.valor < maior*0.2 ? 'fraco' : '');
    return '<div class="'+classe+'" style="height:'+Math.max(2,alt)+'%" title="dia '+x.dia+': '+brl(x.valor)+'"></div>';
  }).join('');

  var h = '<div class="carta"><span class="rotulo">'+esc(f.mes)+' até agora</span>'+
    '<div class="numero">'+brl(f.acumulado)+'</div>'+
    '<div class="nota">média de '+brl(f.mediaDiaria)+' por dia em '+f.diasFechados+' dia(s) fechado(s)'+(f.hoje?' · hoje já '+brl(f.hoje):'')+'</div>'+
    '<div class="colunas">'+colunas+'</div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:8px"><span class="nota" style="margin:0">dia 1</span>'+
    '<span class="nota" style="margin:0;color:var(--dourado)">dia '+(f.serie.length?f.serie[f.serie.length-1].dia:'')+'</span></div></div>';

  h += '<div class="secao">Projeção de fechamento</div><div class="carta"><div class="faixa">'+
    '<div><span class="rotulo">piso</span><span class="num">'+curto(f.projecao.piso)+'</span></div>'+
    '<div class="centro" style="text-align:center"><span class="rotulo">provável</span><span class="num">'+curto(f.projecao.centro)+'</span></div>'+
    '<div style="text-align:right"><span class="rotulo">teto</span><span class="num">'+curto(f.projecao.teto)+'</span></div></div>'+
    '<div class="nota">A distância entre o piso e o teto é a informação: mostra o quanto os meses anteriores variaram na segunda metade.</div></div>';

  if (f.anteriores && f.anteriores.length) {
    h += '<div class="secao">No mesmo dia dos meses anteriores</div><div class="carta">';
    f.anteriores.forEach(function(m){
      var dif = f.acumulado - m.ateEsteDia, pc = m.ateEsteDia ? Math.round((dif/m.ateEsteDia)*100) : 0;
      h += '<div class="linha-mes"><span>'+esc(m.nome)+'</span><span>'+brl(m.ateEsteDia)+' <span class="'+(dif>=0?'pos':'neg')+'">'+(dif>=0?'+':'')+pc+'%</span></span></div>';
    });
    f.anteriores.forEach(function(m){
      h += '<div class="linha-mes" style="color:var(--texto-2)"><span>'+esc(m.nome)+' fechou</span><span>'+brl(m.total)+'</span></div>';
    });
    h += '</div>';
  }
  $('fat').innerHTML = h;
}

// ===========================================================================
// AJUSTES
// ===========================================================================
async function forcarAtualizacao() {
  try {
    if ('caches' in window) { var nomes = await caches.keys(); await Promise.all(nomes.map(function(n){ return caches.delete(n); })); }
    if (navigator.serviceWorker) { var regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(function(r){ return r.unregister(); })); }
  } catch (e) {}
  location.reload(true);
}

async function testarRotaRodonaves() {
  var alvo = $('teste-rota');
  alvo.textContent = 'perguntando ao motor…';
  try {
    var p = PEDIDOS && PEDIDOS.length ? PEDIDOS[0] : null;
    if (!p) {
      var resposta = await pedir('pedidos', {});
      p = (resposta.pedidos || [])[0];
      if (!p) { alvo.textContent = 'O motor não devolveu pedido nenhum.'; return; }
    }
    alvo.textContent = 'cotando a Rodonaves no pedido de ' + p.cliente + '… ela demora até um minuto.';
    var r = await pedir('rodonaves', { loja: p.loja, pedido: idDe(p) });
    var partes = [];
    (r.cotadas || []).forEach(function(c){ partes.push('COTOU R$ ' + Number(c.v).toFixed(2) + (c.prazo ? '  ' + c.prazo + ' dias' : '') + (c.cotacao ? '  cotação ' + c.cotacao : '')); });
    (r.recusadas || []).forEach(function(x){ partes.push('recusou: ' + x.msg); });
    (r.manuais || []).forEach(function(x){ partes.push('para digitar: ' + x.obs); });
    alvo.textContent = partes.length ? partes.join('\n') : 'respondeu vazio.';
  } catch (e) {
    alvo.textContent = 'FALHOU: ' + e.message + '\n\nSe falar em rota desconhecida, o APP_API.gs implantado é anterior ao botão da Rodonaves.';
  }
}

function salvarConfig() {
  cfg.url = $('cfg-url').value.trim();
  cfg.chave = $('cfg-chave').value.trim();
  localStorage.setItem('app_url', cfg.url);
  localStorage.setItem('app_chave', cfg.chave);
  $('cfg-status').textContent = 'Conferindo…';
  pedir('ping', {})
    .then(function(){ $('cfg-status').textContent = 'Funcionando. Pode usar as outras abas.'; PEDIDOS=[]; FAT=null; })
    .catch(function(e){ $('cfg-status').textContent = 'Não consegui: ' + e.message; });
}

// ===========================================================================
// O ARRANQUE
// ===========================================================================
$('cfg-url').value = cfg.url;
$('cfg-chave').value = cfg.chave;

if (!cfg.url || !cfg.chave) {
  irPara(3);
  $('aviso').style.display = '';
  $('aviso').textContent = 'Primeiro uso: ponha o endereço e a chave em Ajustes.';
} else {
  carregarPedidos();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
